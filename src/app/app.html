<!-- usando componentes do material design para montar minha header, meu nav e meus links -->
<mat-toolbar class="app-toolbar">
  <a class="brand" routerLink="/">BookStoreStar</a>
  <nav class="app-nav" aria-label="Navegação principal">
    <a mat-button routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a mat-button routerLink="/livros" routerLinkActive="ativo">Livros</a>
    <a mat-button routerLink="/autores" routerLinkActive="ativo">Autores</a>
  </nav>
</mat-toolbar>

<!-- conteúdo principal -->
<main class="page-content"><router-outlet /></main>
