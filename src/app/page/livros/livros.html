<!-- montando o componente que mostra o index com todos os livros cadastrados -->
<h1>Livros</h1>
<!-- aqui estão os inputs para adicionar novos livros -->
<!-- o ngmodel serve pra atribuir os nomes aos campos -->
  <div class="forms">
    <mat-form-field appearance="outline">
    <mat-label>Titulo</mat-label>
    <input matInput [(ngModel)]="novoLivro.titulo">
    </mat-form-field>
    <mat-form-field appearance="outline">
    <mat-label>Autor</mat-label>
    <input matInput [(ngModel)]="novoLivro.autor">
    </mat-form-field>
    <mat-form-field appearance="outline">
    <mat-label>Ano</mat-label>
    <input matInput [(ngModel)]="novoLivro.ano" type="number">
    </mat-form-field>
    <mat-form-field appearance="outline">
    <mat-label>URL da Imagem</mat-label>
    <input matInput [(ngModel)]="novoLivro.imagem">
    </mat-form-field>
    <button mat-flat-button (click)="salvar()">Salvar</button>
  </div>

<div class="lista">
    @for (livro of livros(); track livro._id){
        <app-cartao>
        @if (livro.imagem) {
        <img imagem [src]="livro.imagem" [alt]="livro.titulo" width="120">
        }
        <h3>{{ livro.titulo }}</h3>
        <p>Autor: {{ livro.autor }}</p>
        <p>Ano: {{ livro.ano }}</p>
        <div acoes>
        <button mat-icon-button (click)="preencherFormulario(livro)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button (click)="excluir(livro._id!)"><mat-icon>delete</mat-icon></button>
        </div>
    </app-cartao>
    }
</div>
